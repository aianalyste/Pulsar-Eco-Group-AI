<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="stylesheet" href="form.css">
    <link rel="shortcut icon" href="images/Pulsar Icon.jpeg" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="ville-data.js"></script>
    <script src="ville-input.js"></script>
    <script src="paiement.js"></script>
    <script src="guide.js"></script>
    <script src="ai-engine.js"></script>
    <title>Module Agricole — Pulsar Eco Group</title>
</head>
<body>
<header><img id="logo" src="images/Pulsar Icon.jpeg" alt="Pulsar Eco Group"></header>
<form onsubmit="event.preventDefault();">
    <h1>Pompage Solaire Agricole &amp; Irrigation</h1>

    <div style="background:#fff3e0;border:1.5px solid #ff9800;border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <span style="font-size:.88rem;color:#e65100;"><strong>📌 Comment utiliser :</strong> Ville → Données agricoles → Hydraulique → Validez !</span>
        <button type="button" onclick="lancerGuide('agri')" style="background:#e65100;color:#fff;border:none;padding:7px 16px;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:600;">👆 Guide interactif</button>
    </div>

    <section class="formulaire">
        <h2>Localisation &amp; Culture</h2>
        <div id="ville-container"></div>
        <label>Surface à irriguer (ha)</label>
        <input type="number" id="surface" step="0.1" min="0" required oninput="verifierFormulaire()">
        <label>Type de culture</label>
        <select id="culture" onchange="verifierFormulaire()">
            <option value="5">Maïs (5 mm/jour)</option>
            <option value="6">Riz (6 mm/jour)</option>
            <option value="4">Tomate (4 mm/jour)</option>
            <option value="3">Oignon (3 mm/jour)</option>
        </select>
        <label>Type d'irrigation</label>
        <select id="efficiency">
            <option value="0.9">Goutte-à-goutte (90%)</option>
            <option value="0.75">Aspersion (75%)</option>
            <option value="0.6">Gravitaire (60%)</option>
        </select>
    </section>

    <section class="formulaire">
        <h2>Données hydrauliques</h2>
        <label>Profondeur dynamique (m)</label>
        <input type="number" id="depth" min="0" required oninput="verifierFormulaire()">
        <label>Hauteur réservoir (m)</label>
        <input type="number" id="tankHeight" min="0" required oninput="verifierFormulaire()">
        <label>Heures de pompage / jour</label>
        <input type="number" id="hours" value="6" min="1" max="24" required oninput="verifierFormulaire()">
    </section>

    <section class="formulaire">
        <h2>Paramètres solaires</h2>
        <label>HSP (mis à jour selon la ville)</label>
        <input type="number" id="psh" value="5.2" min="1" step="0.1" required oninput="verifierFormulaire()">
        <label>Puissance panneau (W)</label>
        <input type="number" id="panelPower" value="400" min="100" required>
    </section>

    <button class="valider-btn" id="btn-valider" type="button" onclick="validerEtAnalyser()" disabled>
        ✅ Valider &amp; Lancer l'Analyse IA
    </button>

    <div id="ia-results" style="margin-top:20px;"></div>
    <br>
    <button class="pdf-btn" type="button" onclick="generatePDF()">📄 Télécharger Devis PDF</button>
</form>
<footer>
        <section><h3>Contactez-nous</h3>
            <div class="contact">
                <a href="https://www.facebook.com/profile.php?id=100063567024819" target="_blank"><i class="fa-brands fa-facebook"></i> Facebook</a>
                <a href="https://wa.me/22892196727" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                <a href="tel:+22892196727"><i class="fa-solid fa-phone"></i> +228 92 19 67 27</a>
                <a href="tel:+22890104393"><i class="fa-solid fa-phone"></i> +228 90 10 43 93</a>
            </div>
        </section>
        <hr>
        <small><span>P</span>ulsar <span>E</span>co <span>G</span>roup © 2026</small>
    </footer>
<script src="agri.js"></script>
<script>
    if (!verifierAcces()) {
        afficherPageAbonnement('Module Agricole');
    } else {
        afficherBandeauUser();
        creerChampVille('ville-container');
    }
</script>
</body>
</html>
