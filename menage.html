<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="stylesheet" href="form.css">
    <link rel="shortcut icon" href="images/Pulsar Icon.jpeg" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="ville-data.js"></script>
    <script src="ville-input.js"></script>
    <script src="paiement.js"></script>
    <script src="guide.js"></script>
    <script src="ai-engine.js"></script>
    <title>Ménage — Pulsar Eco Group</title>
</head>
<body>
<header><img id="logo" src="images/Pulsar Icon.jpeg" alt="Pulsar Eco Group"></header>
<form onsubmit="event.preventDefault();">
    <h1>Module Domestique</h1>

    <!-- Bandeau guide -->
    <div style="background:#fff3e0;border:1.5px solid #ff9800;border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <span style="font-size:.88rem;color:#e65100;"><strong>📌 Comment utiliser :</strong> Entrez votre ville → Ajoutez vos appareils → Validez !</span>
        <button type="button" onclick="lancerGuide('menage')" style="background:#e65100;color:#fff;border:none;padding:7px 16px;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:600;">👆 Guide interactif</button>
    </div>

    <div id="ville-container"></div>

    <h3>Inventaire des équipements</h3>
    <table id="equipmentTable">
        <tr><th>Nom de l'appareil</th><th>Puissance (W)</th><th>Quantité</th><th>Heures/Jour</th><th>Action</th></tr>
    </table>
    <button class="add-btn" type="button" onclick="addRow()">+ Ajouter un équipement</button>
    <hr>

    <h2>Paramètres</h2>
    <label>Autonomie (nuits sans soleil) :</label>
    <input type="number" id="autonomy" value="1" min="1" oninput="verifierFormulaire()"><br>
    <label>HSP — Heures Solaires Pleines (mis à jour selon la ville) :</label>
    <input type="number" id="hsp" value="5.2" min="1" step="0.1"><br>
    <hr>

    <button class="valider-btn" id="btn-valider" type="button" onclick="validerEtAnalyser()" disabled>
        ✅ Valider &amp; Lancer l'Analyse IA
    </button>

    <div id="ia-results" style="margin-top:20px;"></div>
    <br>
    <button class="pdf-btn" type="button" onclick="generatePDF()">📄 Télécharger Devis PDF</button>
</form>
<footer>
        <section><h3>Contactez-nous</h3>
            <div class="contact">
                <a href="https://www.facebook.com/profile.php?id=100063567024819" target="_blank"><i class="fa-brands fa-facebook"></i> Facebook</a>
                <a href="https://wa.me/22892196727" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                <a href="tel:+22892196727"><i class="fa-solid fa-phone"></i> +228 92 19 67 27</a>
                <a href="tel:+22890104393"><i class="fa-solid fa-phone"></i> +228 90 10 43 93</a>
            </div>
        </section>
        <hr>
        <small><span>P</span>ulsar <span>E</span>co <span>G</span>roup © 2026</small>
    </footer>
<script src="menage.js"></script>
<script>
    if (!verifierAcces()) {
        afficherPageAbonnement('Ménage');
    } else {
        afficherBandeauUser();
        creerChampVille('ville-container');
    }
</script>
</body>
</html>
